name: AirMile verified-award checks
on:
  pull_request:
    branches: [main]
  push:
    branches: [feature/verified-award-data-gate-20261026]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: ${{ github.event_name == 'push' && 'write' || 'read' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Repair outdated lockfile metadata
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit repaired lockfile on working branch only
        if: github.event_name == 'push'
        run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add package-lock.json
            git commit -m 'build: reconcile package-lock for reproducible npm ci'
            git push origin HEAD:feature/verified-award-data-gate-20261026
          fi
      - name: Verify clean dependency installation
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Logic tests
        run: npm test
      - name: Build without production migrations
        run: npm run build:dev
