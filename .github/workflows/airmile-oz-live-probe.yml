name: AirMile Asiana single-month observation

# Explicit diagnostic experiments only. No schedule or ordinary source-change trigger.
on:
  push:
    branches: [feature/verified-award-data-gate-20261026]
    paths: [.github/workflows/airmile-oz-live-probe.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  observe:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[probe:oz]')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Isolate HTTP2 protocol failure - no proxy or authentication changes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/probes/asiana-observation.mjs')
          s = p.read_text()
          old = "{ channel: 'chrome', headless: false }"
          assert s.count(old) == 1
          p.write_text(s.replace(old, "{ channel: 'chrome', headless: false, args: ['--disable-http2'] }"))
          PY
      - name: One public UI lookup - same route and month via HTTP1
        run: xvfb-run -a node scripts/probes/asiana-observation.mjs
      - name: Retain anonymous public observation or failure report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oz-single-month-observation
          path: probe-results/
          retention-days: 1
          if-no-files-found: warn
